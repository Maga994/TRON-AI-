<!DOCTYPE html>
<html lang="tj">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRON AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            padding: 15px;
            text-align: center;
            background-color: #1e293b;
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
        }
        .chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
        }
        .bot {
            background-color: #1e293b;
            align-self: flex-start;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: #1e293b;
        }
        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            outline: none;
        }
        button {
            margin-left: 10px;
            padding: 10px 15px;
            background-color: #38bdf8;
            border: none;
            border-radius: 5px;
            color: #0f172a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>TRON AI</header>
    <div class="chat-container">
        <div class="message bot">Ассалому алейкум! Ман TRON AI. Чӣ кумак карда метавонам?</div>
    </div>
    <div class="input-area">
        <input type="text" placeholder="Саволи худро нависед...">
        <button>Фиристодан</button>
    </div>
</body>
</html>
